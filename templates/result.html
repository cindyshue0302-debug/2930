<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>測驗結果</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 20px; }
        .result-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .correct { color: green; }
        .wrong { color: red; }
    </style>
</head>
<body>
    <div class="result-card">
        <h1>測驗結束！</h1>
        <h2>你的得分：{{ score }} / {{ total }}</h2>
        <hr>
        {% for res in results %}
        <div>
            <p><strong>題目：{{ res.question }}</strong></p>
            <p>你的回答：{{ res.user_answer }} 
               {% if res.is_correct %}<span class="correct">✔ 正確</span>
               {% else %}<span class="wrong">✘ 錯誤</span>{% endif %}</p>
            {% if not res.is_correct %}<p>正確答案是：{{ res.correct_answer }}</p>{% endif %}
        </div>
        <hr>
        {% endfor %}
        <a href="/">重新測驗</a>
    </div>
</body>
</html>
